<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
a:focus-visible,label:focus-visible,button:focus-visible{outline:2px solid #e8b800;outline-offset:2px}
.gochk{position:absolute;opacity:0;pointer-events:none}
.card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(15,20,69,.06),0 8px 24px rgba(15,20,69,.06),0 0 0 1px rgba(15,20,69,.06);transition:box-shadow .18s,transform .18s;cursor:pointer}
.card:hover{box-shadow:0 2px 4px rgba(15,20,69,.06),0 16px 36px rgba(15,20,69,.12),0 0 0 1px rgba(26,31,110,.25);transform:translateY(-3px)}
.card:active{transform:translateY(-1px) scale(.99)}
.tile{flex:none;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#eef0f8;color:#1a1f6e}
.chip{font-size:12px;font-weight:600;color:#1a1f6e;background:#eef0f8;border-radius:999px;padding:4px 10px;white-space:nowrap}
.code{font-size:24px;font-weight:700;letter-spacing:-0.02em}
.full{font-size:13px;color:#64748b}
.desc{font-size:14.5px;line-height:1.5;color:#334155}
.go{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:#1a1f6e}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stat{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .15s}
.stat:hover{background:rgba(255,255,255,.11)}
.flip{display:inline-flex;gap:3px}
.flip span{position:relative;width:24px;height:34px;border-radius:5px;background:#232a78;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;animation:flip .55s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 50%}
.flip span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45)}
@keyframes flip{0%{transform:perspective(200px) rotateX(-90deg);opacity:.2}60%{transform:perspective(200px) rotateX(12deg);opacity:1}100%{transform:none}}
.arrive{animation:arrive .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.win{animation:blink 5s ease-in-out infinite}
.w1{animation-delay:-2s}.w2{animation-delay:-3.4s}
@keyframes blink{0%,100%{opacity:.95}50%{opacity:.45}}
.glow{opacity:.85}
.bld,.mp,.rt{transition:opacity .2s}
.pin .pr,.mp .pr{transition:fill .2s}
.root:has(.k:hover) .bld{opacity:.4}
.root:has(.k:hover) .pin{opacity:.35}
.root:has(.k-VRMS:hover) .b-VRMS,.root:has(.k-VMMS:hover) .b-VMMS,.root:has(.k-BMS:hover) .b-BMS{opacity:1}
.root:has(.k-VRMS:hover) .pin-VRMS,.root:has(.k-VMMS:hover) .pin-VMMS,.root:has(.k-BMS:hover) .pin-BMS{opacity:1}
.root:has(.k-VRMS:hover) .pin-VRMS .pr,.root:has(.k-VMMS:hover) .pin-VMMS .pr,.root:has(.k-BMS:hover) .pin-BMS .pr{fill:#e8b800}
.zone{transition:fill .2s,stroke-opacity .2s}
.root:has(.k-VRMS:hover) .zone-VRMS,.root:has(.k-VMMS:hover) .zone-VMMS,.root:has(.k-BMS:hover) .zone-BMS{fill:rgba(232,184,0,.16);stroke-opacity:1}
.ov{display:none;position:absolute;inset:0;z-index:50;background:#0f1445;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:28px;animation:ovIn .25s ease both}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.root:has(#go-VRMS:checked) .ov-VRMS,.root:has(#go-VMMS:checked) .ov-VMMS,.root:has(#go-BMS:checked) .ov-BMS{display:flex}
.rline{stroke-dasharray:620;stroke-dashoffset:620;animation:draw 1.6s cubic-bezier(.45,0,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rtruck{animation:drive 1.6s cubic-bezier(.45,0,.2,1) .15s both}
@keyframes drive{from{transform:translateX(0)}to{transform:translateX(600px)}}
.arrived{opacity:0;animation:fadeIn .3s ease 1.75s forwards}
@keyframes fadeIn{to{opacity:1}}
.dock{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:190px;cursor:pointer}
.door{position:relative;width:170px;height:190px;border-radius:10px 10px 4px 4px;background:#060828;box-shadow:inset 0 0 0 5px #2a3290, 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.inside{position:absolute;inset:5px;border-radius:6px 6px 2px 2px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px;transition:background .3s}
.inside .ic{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.shutter{position:absolute;left:5px;right:5px;top:5px;height:calc(100% - 10px);background:repeating-linear-gradient(180deg,#3a43a6 0 9px,#2c348f 9px 11px);transform:translateY(-58%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 3px 0 #1a2070}
.dock:hover .shutter{transform:translateY(-96%)}
.dock:hover .inside .ic{transform:translateY(-14px) scale(1.05)}
.bumper{width:170px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,#e8b800 0 10px,#0f1445 10px 20px);opacity:.9}
.qk{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:500;color:#fff;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.qk:hover{background:rgba(255,255,255,.13)}
.ow{width:24px;height:34px;overflow:hidden;border-radius:5px;background:#232a78;box-shadow:inset 0 6px 8px rgba(0,0,0,.35),inset 0 -6px 8px rgba(0,0,0,.35);display:inline-block}
.oreel{display:flex;flex-direction:column;animation:roll1 1.3s cubic-bezier(.2,.8,.2,1) both}
.oreel span{height:34px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
@keyframes roll1{from{transform:translateY(0)}to{transform:translateY(calc(var(--n) * -34px))}}
.hgarm{transform-origin:458px 156px;animation:hgarm 2.8s cubic-bezier(.4,0,.2,1) .1s both}
@keyframes hgarm{0%,28%{transform:rotate(0)}48%,100%{transform:rotate(80deg)}}
.hgred{animation:hgred 2.8s steps(1) .1s both}@keyframes hgred{0%,24%{opacity:1}25%,100%{opacity:.15}}
.hggreen{animation:hggreen 2.8s steps(1) .1s both}@keyframes hggreen{0%,24%{opacity:.15}25%,100%{opacity:1}}
.hgdrive{transform-origin:320px 150px;animation:hgdrive 2.8s cubic-bezier(.5,0,.8,.4) .1s both}
@keyframes hgdrive{0%,55%{transform:scale(1);opacity:1}100%{transform:scale(3.2);opacity:0}}
.arrived{animation-delay:2.7s}
@media (prefers-reduced-motion: reduce){.oreel{transform:translateY(calc(var(--n) * -34px))}.hgarm{transform:rotate(80deg)}.hgdrive{opacity:1}}.hgdrive2{transform-origin:320px 78px;animation:hgdrive2 2.8s cubic-bezier(.5,0,.8,.4) .1s both}@keyframes hgdrive2{0%,55%{transform:scale(1);opacity:1}100%{transform:scale(4.2);opacity:0}}.spk,.drp{transition:stroke .2s,fill .2s,opacity .2s}.hchip{opacity:0;transition:opacity .2s}
.root:has(.k:hover) .spk{stroke:rgba(255,255,255,.12)}
.root:has(.k-BMS:hover) .spk{stroke:#e8b800}.root:has(.k-BMS:hover) .drp{fill:#e8b800}
.root:has(.k-VMMS:hover) .hc-VMMS,.root:has(.k-VRMS:hover) .hc-VRMS{opacity:1}
.root:has(.k-VMMS:hover) .hub .ring,.root:has(.k-VRMS:hover) .hub .ring{stroke:#e8b800}
@media (prefers-reduced-motion: reduce){.arrive,.flip span,.win,.rline,.rtruck,.arrived,.ov{animation:none!important;opacity:1;stroke-dashoffset:0}.shutter,.card,.inside .ic{transition:none}}

.root{height:900px}
.mapbox{position:absolute;z-index:1;pointer-events:none}
.mapbox svg{pointer-events:auto}
.card{display:flex;flex-direction:column;box-sizing:border-box}
.chipd{font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;white-space:nowrap}
.st2{display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .15s;color:#fff}
.st2:hover{background:rgba(255,255,255,.11)}
.st2 .lab{flex:1;font-size:13px;line-height:1.3;color:rgba(255,255,255,.75)}
.st2 .ico{color:rgba(255,255,255,.55);display:flex}
.srow{display:flex;align-items:center;gap:16px;height:88px;padding:0 20px 0 16px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:background .15s,transform .18s;color:#fff;cursor:pointer}
.srow:hover{background:rgba(255,255,255,.12);transform:translateX(4px)}
.srow:hover .sar{color:#e8b800}
.srow .tl{width:46px;height:46px;border-radius:12px;background:#e8b800;color:#0f1445;display:flex;align-items:center;justify-content:center;flex:none}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .15s}
.lrow:hover{background:rgba(255,255,255,.11)}
.bayt{position:relative;display:block;height:118px;background:#141a55;border-radius:18px 18px 0 0;overflow:hidden}
.bayd{position:absolute;left:28px;right:28px;top:34px;bottom:10px;background:#060828;border-radius:6px 6px 0 0;box-shadow:inset 0 0 0 4px #2a3290;overflow:hidden}
.bayd .bi{position:absolute;left:50%;bottom:12px;margin-left:-24px;width:48px;height:48px;border-radius:12px;background:#e8b800;color:#0f1445;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bsh{position:absolute;left:4px;right:4px;top:4px;height:calc(100% - 4px);background:repeating-linear-gradient(180deg,#3a43a6 0 8px,#2c348f 8px 10px);box-shadow:0 3px 0 #1a2070;transform:translateY(-66%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover .bsh{transform:translateY(-94%)}
.card:hover .bayd .bi{transform:translateY(-8px)}
.bayb{position:absolute;left:20px;right:20px;bottom:0;height:10px;background:repeating-linear-gradient(135deg,#e8b800 0 10px,#0f1445 10px 20px)}
.bays{position:absolute;top:9px;left:50%;transform:translateX(-50%);padding:3px 10px;border-radius:5px;background:#fff;color:#0f1445;font-size:11.5px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.fld{display:flex;flex-direction:column;gap:6px}.fld label{font-size:13.5px;font-weight:600;color:#0f172a}.fld input{height:46px;border-radius:10px;border:1px solid #cbd2ea;padding:0 14px;font:inherit;font-size:15px;color:#0f172a;background:#fff}.fld input:focus{outline:none;border-color:#1a1f6e;box-shadow:0 0 0 3px rgba(26,31,110,.16)}.pbtn{height:48px;border:0;border-radius:12px;background:#0f1445;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s}.pbtn:hover{background:#1a1f6e}.lnk{font-size:13.5px;font-weight:600;color:#1a1f6e;text-decoration:underline;text-underline-offset:3px}.tr{animation:hw 34s linear infinite}@keyframes hw{from{transform:translateX(-160px)}to{transform:translateX(1460px)}}.tri{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-1px)}}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#1a1f6e}
.back:hover{text-decoration:underline;text-underline-offset:3px}
.slots{display:flex;gap:8px}
.slot{width:52px;height:58px;border-radius:10px;border:1px solid #cbd2ea;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#0f172a;font-variant-numeric:tabular-nums;box-sizing:border-box}
.slot.on{border:2px solid #0f1445;box-shadow:0 0 0 3px rgba(232,184,0,.45)}
.slot.on::after{content:"";width:2px;height:26px;background:#0f1445;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.rule{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#475569}
.rule .ok{color:#067647}.rule .no{color:#94a3b8}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:#475569;display:flex;align-items:center;justify-content:center}
.pw button:focus-visible{outline:2px solid #1a1f6e;outline-offset:0}.pw input{width:100%;box-sizing:border-box;padding-right:46px}
.hint{font-size:13.5px;color:#64748b;line-height:1.5}

.slot.on{border:2px solid #0f1445;box-shadow:0 0 0 4px rgba(15,20,69,.1)}
.step{margin:0 0 -14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meter span{height:6px;border-radius:3px;background:#e2e8f0}
.meter .f{background:#067647}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.rc{display:flex;align-items:center;gap:8px;font-size:13px;color:#334155}
.rc .dot{width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
.rc .ok{background:#ecfdf3;color:#067647}
.match{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#067647}

</style>
