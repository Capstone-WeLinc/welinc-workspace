<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, drawn van at the garage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
.pg{width:1440px;height:900px;display:grid;grid-template-columns:840px 600px;font-family:Inter,system-ui,sans-serif;color:#0f172a;overflow:hidden}
.rt{background:#fff;display:flex;align-items:center;justify-content:center}
.fm{width:384px;display:flex;flex-direction:column;gap:26px;margin:0}
.fm h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.sub{margin:8px 0 0;font-size:15px;color:#475569}
.fs{display:flex;flex-direction:column;gap:18px}
.fm label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:flex-start}
.row a{font-size:14px;font-weight:600;color:#1a1f6e}
.in{box-sizing:border-box;width:100%;height:46px;border:1px solid #64748b;border-radius:12px;padding:0 14px;font:15px Inter,sans-serif;color:#0f172a;background:#fff}
.in::placeholder{color:#5b6779}
.btn{height:48px;border:0;border-radius:12px;background:#0f1445;color:#fff;font:700 16px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.hint{margin:0;font-size:14px;line-height:1.5;color:#5b6779}
.lf{position:relative;overflow:hidden;background:#0f1445;color:#fff}
.lk{position:absolute;left:64px;top:40px;display:flex;align-items:center;gap:10px}.lk svg{height:20px;fill:#e8b800}.lk span{font-weight:800;font-style:italic;font-size:16px}
.cp{position:absolute;left:64px;top:140px}
h1{margin:0;font-size:64px;line-height:1;font-weight:800;letter-spacing:-.035em}
h1 em{font-style:normal;color:#e8b800}
.ln{margin:18px 0 0;font-size:18px;line-height:1.55;color:rgba(255,255,255,.72);max-width:440px}
.sc{position:absolute;left:0;bottom:0;width:840px;height:470px}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.puff.b{animation-delay:.8s}.puff.c{animation-delay:1.6s}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.5}100%{opacity:0;transform:translate(-46px,-30px) scale(1.6)}}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.14}50%{opacity:.08}}
.spill{animation:spill 3.2s ease-in-out infinite}
@keyframes spill{0%,100%{opacity:.7}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.puff,.glow,.spill{animation:none}}
</style>
</helmet>
<div class="pg">
<div class="lf">
<div class="lk"><svg viewBox="0 0 330 185" aria-hidden="true"><polygon points="82,0 144,0 66,183 4,183"/><polygon points="177,0 240,0 162,183 100,183"/><polygon points="265,0 328,0 268,140 328,140 328,183 187,183"/></svg><span>WeLinc Logistics</span></div>
<div class="cp"><h1>Keep every truck<br><em>on the road.</em></h1><p class="ln">Bookings, maintenance and repairs in one WeLinc workspace.</p></div>
<svg class="sc" viewBox="0 0 840 470" aria-hidden="true">
<defs>
<symbol id="van" viewBox="-8 -2 138 56">
<rect x="0" y="0" width="92" height="38" rx="2.5" fill="#f7f8fb" stroke="#c9d0de"/>
<path d="M0.5 25 C28 19 60 31 91.5 15 V22 C60 34 28 24 0.5 30 Z" fill="#f29a1f"/>
<path d="M0.5 30 C28 24 60 34 91.5 22 V36 a2 2 0 0 1 -2 2 H2.5 a2 2 0 0 1 -2 -2 Z" fill="#1f5cc4"/>
<g transform="translate(6 6) scale(0.0541)" fill="#e8b800"><polygon points="82,0 144,0 66,183 4,183"/><polygon points="177,0 240,0 162,183 100,183"/><polygon points="265,0 328,0 268,140 328,140 328,183 187,183"/></g>
<text x="26" y="15" font-size="11" font-weight="800" font-style="italic" fill="#0f1445" font-family="Inter,sans-serif">WeLinc</text>
<path d="M95 10h16l13 13v15H95z" fill="#eef1f6" stroke="#c3cad8"/>
<path d="M99 14h10l8 8h-18z" fill="#14205a"/>
<rect x="95" y="30" width="29" height="3" fill="#c3cad8"/>
<rect x="86" y="36" width="38" height="5" fill="#2a2f45"/>
<rect x="-4" y="27" width="4" height="13" rx="1" fill="#8d96ab"/>
<circle cx="16" cy="44" r="7" fill="#11131f"/><circle cx="16" cy="44" r="3" fill="#aab2c5"/>
<circle cx="34" cy="44" r="7" fill="#11131f"/><circle cx="34" cy="44" r="3" fill="#aab2c5"/>
<circle cx="110" cy="44" r="7" fill="#11131f"/><circle cx="110" cy="44" r="3" fill="#aab2c5"/>
<rect x="124" y="24" width="4" height="6" rx="1" fill="#f29a1f"/>
</symbol>
<linearGradient id="spill" x1="0" x2="1"><stop offset="0" stop-color="#e8b800" stop-opacity=".16"/><stop offset="1" stop-color="#e8b800" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="120" width="230" height="300" fill="#141a55"/>
<rect x="0" y="108" width="246" height="16" fill="#1a2263"/>
<rect x="24" y="190" width="186" height="230" fill="#060828"/>
<rect class="glow" x="24" y="288" width="186" height="132" fill="#e8b800" opacity=".14"/>
<rect x="24" y="190" width="186" height="96" fill="#232a78"/><g stroke="#141a55" stroke-width="2"><path d="M24 202h186M24 214h186M24 226h186M24 238h186M24 250h186M24 262h186M24 274h186"/></g><rect x="24" y="282" width="186" height="6" fill="#3b43a3"/>
<path class="spill" d="M210 420 L560 420 L210 300 Z" fill="url(#spill)"/>
<rect x="0" y="420" width="840" height="50" fill="#0a0d36"/>
<g fill="#cbd2ea" opacity=".35"><rect x="270" y="444" width="70" height="4" rx="2"/><rect x="420" y="444" width="70" height="4" rx="2"/><rect x="570" y="444" width="70" height="4" rx="2"/><rect x="720" y="444" width="70" height="4" rx="2"/></g>
<ellipse cx="520" cy="422" rx="300" ry="9" fill="#000" opacity=".35"/>
<use href="#van" x="215" y="187" width="607" height="246"/>
<g fill="#cbd2ea"><circle class="puff" cx="230" cy="366" r="9"/><circle class="puff b" cx="230" cy="366" r="9"/><circle class="puff c" cx="230" cy="366" r="9"/></g>
</svg>
</div>
<div class="rt"><form class="fm">
<div><h2>Sign in</h2><p class="sub">Use your WeLinc work email.</p></div>
<div class="fs">
<div><label for="e">Work email</label><input id="e" class="in" placeholder="you@welinc.com"></div>
<div><div class="row"><label for="p">Password</label><a href="#">Forgot password?</a></div><input id="p" type="password" class="in" placeholder="Enter password"></div>
<button type="button" class="btn">Sign in <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
<p class="hint">No account yet? Ask your admin to add you. You'll get an email to set your password.</p>
</form></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
