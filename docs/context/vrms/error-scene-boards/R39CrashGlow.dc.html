<html lang="en">
<head>
<meta charset="utf-8">
<title>Crash, hazard glow</title>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #e8b800;outline-offset:2px}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:rgba(255,255,255,.72)}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.cur{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.sec{margin:18px 12px 6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.btn{height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border:0;transition:background .15s,box-shadow .15s}
.btn.p{background:#1a1f6e;color:#fff}.btn.p:hover{background:#0f1445}
.btn.o{background:#fff;color:#0f172a;box-shadow:inset 0 0 0 1px #cbd2ea}.btn.o:hover{background:#f3f5f9}
.panel{width:720px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,20,69,.06),0 8px 24px rgba(15,20,69,.06),0 0 0 1px rgba(15,20,69,.06)}
.ptxt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 48px 32px}
.ptxt h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.01em;color:#0f172a}
.ptxt p.l{margin:8px 0 0;font-size:15px;line-height:1.55;color:#475569;max-width:520px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.det{margin:18px 0 0;width:100%;box-sizing:border-box;text-align:left;padding:10px 12px;border-radius:8px;background:#f1f3f8;box-shadow:inset 0 0 0 1px #dde2ee;font-size:12.5px;line-height:1.6;color:#0f172a;white-space:pre-wrap;user-select:all}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(15,20,69,.06),0 0 0 1px rgba(15,20,69,.07)}
.blink{animation:blink2 1.1s steps(1) infinite}.b2{animation-delay:.55s}@keyframes blink2{50%{opacity:.15}}
.slow{animation:slow 2.4s ease-in-out infinite}@keyframes slow{50%{opacity:.25}}
.puff{animation:puff 3.6s ease-out infinite;opacity:0}.pf2{animation-delay:1.2s}.pf3{animation-delay:2.4s}
.puff{transform-box:fill-box;transform-origin:center}@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.65}100%{opacity:0;transform:translate(-14px,-40px) scale(1.8)}}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.flick{animation:flick 4.5s steps(1) infinite}@keyframes flick{0%,100%{opacity:1}62%{opacity:.35}64%{opacity:1}66%{opacity:.4}68%{opacity:1}}
.arc{animation:arc 2.4s ease-out infinite;opacity:0}.a2{animation-delay:.4s}.a3{animation-delay:.8s}
@keyframes arc{0%{opacity:0}20%{opacity:.9}55%{opacity:.9}70%,100%{opacity:0}}
.shut{animation:shut 5s ease-in-out infinite}@keyframes shut{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

.puffb{animation:puffb 3.4s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.d1{animation-delay:1.1s}.d2{animation-delay:2.2s}
@keyframes puffb{0%{opacity:0;transform:translate(0,0) scale(.6)}12%{opacity:.75}100%{opacity:0;transform:translate(-12px,-74px) scale(2.6)}}
.drift{animation:drift 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes drift{50%{transform:translate(-4px,-3px) scale(1.06)}}
.glowb{animation:glowb 1.1s steps(1) infinite}.g2{animation-delay:.55s}@keyframes glowb{50%{opacity:0}}
.drip{animation:drip 1.5s ease-in infinite}.dr2{animation-delay:.75s}@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{transform:translateY(15px);opacity:1}100%{transform:translateY(17px);opacity:0}}
.spread{animation:spread 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes spread{from{transform:scaleX(.75)}to{transform:scaleX(1.12)}}
.seq{animation:seq 2.4s ease-in-out infinite}.s1{animation-delay:.6s}.s2{animation-delay:1.2s}.s3{animation-delay:1.8s}
@keyframes seq{0%,45%,100%{fill:rgba(232,184,0,0);stroke-opacity:.55}15%,30%{fill:rgba(232,184,0,.32);stroke-opacity:1}}
.sweep{animation:sweep 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}@keyframes sweep{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.bob{animation:bob .32s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-.7px)}}
.exh{animation:exh 1.8s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.e1{animation-delay:.6s}.e2{animation-delay:1.2s}
@keyframes exh{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.55}100%{opacity:0;transform:translate(10px,-30px) scale(2)}}
.belt{animation:belt .7s linear infinite}@keyframes belt{to{stroke-dashoffset:-20}}
.drawer{animation:drawer 6s cubic-bezier(.3,0,.2,1) infinite}@keyframes drawer{0%,55%{transform:none}70%,80%{transform:translateX(160px)}95%,100%{transform:none}}
.tumble{animation:tumble 5.5s cubic-bezier(.35,0,.6,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes tumble{0%{transform:translate(0,0) rotate(0);opacity:0}6%{opacity:1}30%{transform:translate(150px,-22px) rotate(200deg)}55%{transform:translate(300px,4px) rotate(400deg)}75%{transform:translate(420px,-8px) rotate(560deg);opacity:1}80%,100%{transform:translate(460px,0) rotate(600deg);opacity:0}}
.pan{animation:pan 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}@keyframes pan{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(18deg)}}
.swing{animation:swing 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.spark{animation:spark 1.7s steps(1) infinite;opacity:0}.k2{animation-delay:.4s}.k3{animation-delay:1s}@keyframes spark{0%{opacity:1}8%{opacity:0}30%{opacity:.9}36%{opacity:0}}
.signf{animation:signf 5s steps(1) infinite}@keyframes signf{0%,100%{fill:#3b4270}70%{fill:#e8b800}72%{fill:#3b4270}75%{fill:#e8b800}77%{fill:#3b4270}}
.boom{animation:boom 4.5s ease-in-out infinite;transform-box:view-box}
@keyframes boom{0%,30%{transform:rotate(0)}44%{transform:rotate(-32deg)}50%{transform:rotate(-26deg)}60%{transform:rotate(0)}64%{transform:rotate(-5deg)}68%,100%{transform:rotate(0)}}
.ph{animation:ph 2s ease-in-out infinite}.p1{animation-delay:.25s}.p2{animation-delay:.5s}.p3{animation-delay:.75s}@keyframes ph{0%,100%{opacity:.35}50%{opacity:.9}}
.tick{animation:tick 4s steps(8) infinite;transform-box:view-box}@keyframes tick{to{transform:rotate(360deg)}}
.spin{animation:spin 2.6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.lift{animation:lift 3s ease-in-out infinite}@keyframes lift{50%{transform:translateY(-2px)}}
.lt0{animation:lt0 6s steps(1) infinite}@keyframes lt0{0%{fill:#2a3060}8%{fill:#e9eefc}82%{fill:#2a3060}}
.lc0{animation:lc0 6s steps(1) infinite;opacity:0}@keyframes lc0{0%{opacity:0}8%{opacity:1}82%{opacity:0}}
.lt1{animation:lt1 6s steps(1) infinite}@keyframes lt1{0%{fill:#2a3060}18%{fill:#e9eefc}82%{fill:#2a3060}}
.lc1{animation:lc1 6s steps(1) infinite;opacity:0}@keyframes lc1{0%{opacity:0}18%{opacity:1}82%{opacity:0}}
.lt2{animation:lt2 6s steps(1) infinite}@keyframes lt2{0%{fill:#2a3060}28%{fill:#e9eefc}82%{fill:#2a3060}}
.lc2{animation:lc2 6s steps(1) infinite;opacity:0}@keyframes lc2{0%{opacity:0}28%{opacity:1}82%{opacity:0}}
.lt3{animation:lt3 6s steps(1) infinite}@keyframes lt3{0%{fill:#2a3060}38%{fill:#e9eefc}82%{fill:#2a3060}}
.lc3{animation:lc3 6s steps(1) infinite;opacity:0}@keyframes lc3{0%{opacity:0}38%{opacity:1}82%{opacity:0}}
.lsign{animation:lsign 6s steps(1) infinite}@keyframes lsign{0%{fill:#3b4270}48%{fill:#e8b800}82%{fill:#3b4270}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.puff,.puffb,.exh{opacity:.35}.arc{opacity:.9}.spark{opacity:.8}.lc0,.lc1,.lc2,.lc3{opacity:1}}
</style>
