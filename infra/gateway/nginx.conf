# Replaces the image's stock main file, whose access log prints query strings (spec 0008).
# The access log lives in templates/default.conf.template, and only there.
user nginx;
worker_processes auto;

# crit, not error: nginx's error level lines print the whole request line, query string included.
# Debug upstream failures from the access log's upstream and upstream_status fields.
error_log /var/log/nginx/error.log crit;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
