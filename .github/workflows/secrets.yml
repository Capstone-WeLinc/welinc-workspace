name: Secret scan

# VRMS scope feature 69: fails when a commit adds a password, key or token (gitleaks).
# A pull request scans only its own commits, so an old finding never blocks someone else's work.
# A push to main (and a manual run) scans the whole history.
# A finding means: rotate the secret first, then remove it. Allow a value in .gitleaks.toml only
# when it is public by design (an emulator key, a public badge token).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The plain CLI, pinned and checksum checked. gitleaks-action wants a licence key on organisation repos.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all' }}
        # --redact keeps the secret itself out of the log; the file, line, commit and rule still show
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="$RANGE" --redact --verbose --no-banner --exit-code 1'
