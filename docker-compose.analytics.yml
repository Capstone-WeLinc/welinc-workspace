name: ai-analytics-enhancement

services:
  vrms-analytics-db:
    image: pgvector/pgvector:pg16
    container_name: welinc_vrms_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
      POSTGRES_DB: analytics_db
    ports:
      - "5434:5432"
    volumes:
      - analytics_pgdata:/var/lib/postgresql/data
    networks:
      - welinc-network

  vrms-mongodb:
    image: mongo:6-jammy
    container_name: welinc_vrms_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret_mongo_pass
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - welinc-network

  vrms-analytics-redis:
    image: redis:7-alpine
    container_name: welinc_vrms_analytics_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - welinc-network

  vrms-analytics-ai:
    build:
      context: ./welinc-backend-vrms-analytics-ai
      dockerfile: Dockerfile
    container_name: welinc_vrms_analytics_ai
    restart: unless-stopped
    ports:
      - "8020:8020"
    volumes:
      - ./welinc-backend-vrms-analytics-ai:/app
    env_file:
      - ./welinc-backend-vrms-analytics-ai/.env
    environment:
      PORT: 8020
      ANALYTICS_DB_URL: postgresql://analytics_user:analytics_pass@vrms-analytics-db:5432/analytics_db
      MONGO_URL: mongodb://admin:secret_mongo_pass@vrms-mongodb:27017
      VRMS_DB_URL: postgresql://welinc_vrms_user:welinc_vrms_pass@vrms-db:5432/welinc_vrms_db
      REDIS_URL: redis://vrms-analytics-redis:6379
    depends_on:
      - vrms-analytics-db
      - vrms-mongodb
      - vrms-analytics-redis
    networks:
      - welinc-network

volumes:
  analytics_pgdata:
  mongodata:

networks:
  welinc-network:
    name: welinc-network
    external: true
