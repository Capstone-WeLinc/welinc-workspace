name: auth-infrastructure

services:
  auth-db:
    image: postgres:16-alpine
    container_name: welinc_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: welinc_auth_user
      POSTGRES_PASSWORD: welinc_auth_pass
      POSTGRES_DB: welinc_auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - welinc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welinc_auth_user -d welinc_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-redis:
    image: redis:7-alpine
    container_name: welinc_auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - auth_redisdata:/data
    networks:
      - welinc-network

  auth-service:
    build:
      context: ./welinc-auth
      dockerfile: Dockerfile.dev
    container_name: welinc_auth_service
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./welinc-auth:/app
      - /app/node_modules
    # Lets the container pick up SMTP_* and the signing keys (AUTH_SIGNING_KEYS, CLIENT_*_JWKS) from
    # welinc-auth/.env: run `npm run keys:dev` in welinc-auth once (spec 0002). The environment block
    # below wins on any overlap, so it holds no secrets.
    env_file:
      - path: ./welinc-auth/.env
        required: false
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://welinc_auth_user:welinc_auth_pass@auth-db:5432/welinc_auth_db?schema=public
      # The token issuer (spec 0001 section 1). Every service sets this identical string.
      AUTH_ISSUER: http://localhost:3000/auth
      # nginx sits in front, so the rate limit on /auth/token reads the real caller (spec 0002)
      TRUST_PROXY_HOPS: 1
      CORS_ORIGINS: http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8003
      # Public portal address for the links in setup and reset emails (spec 0009)
      PORTAL_URL: http://localhost:8000
      NODE_ENV: development
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_started
    networks:
      - welinc-network

  # The suite gateway (spec 0008): the same image and templates as staging, only these settings change.
  # Routes and settings: infra/gateway/README.md. It starts and serves its routes with any system
  # missing; that system's routes answer a JSON 502 until it runs.
  api-gateway:
    build:
      context: ./infra/gateway
    image: welinc-gateway:local
    container_name: welinc_api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Mounted for quick edits: after changing a template, `docker restart welinc_api_gateway`
    volumes:
      - ./infra/gateway/templates:/etc/nginx/templates:ro
    environment:
      AUTH_UPSTREAM: http://auth-service:3001
      VRMS_UPSTREAM: http://vrms-backend:3002
      VMMS_UPSTREAM: http://vmms-backend:3010
      VMMS_ANALYTICS_UPSTREAM: http://vmms-analytics:3011
      BMS_UPSTREAM: http://bms-gateway:3020
      ALLOWED_ORIGINS: http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8003
      # 0 locally: nothing in front of the gateway appends the real address
      TRUST_EDGE_PROXY: "0"
      GATEWAY_RATE_PER_SECOND: "20"
      GATEWAY_RATE_BURST: "40"
      # Empty locally (plain http); hosted sets max-age=86400
      GATEWAY_HSTS: ""
    networks:
      - welinc-network

  web-portal:
    build:
      context: ./welinc-web-portal
      dockerfile: Dockerfile.dev
    container_name: welinc_portal
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./welinc-web-portal:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    networks:
      - welinc-network

volumes:
  auth_pgdata:
  auth_redisdata:

networks:
  welinc-network:
    name: welinc-network
    driver: bridge
