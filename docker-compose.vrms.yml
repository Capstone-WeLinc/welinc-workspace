name: vrms-core-environment

services:
  vrms-db:
    # pgvector for the AI embeddings (spec 0013); same major version, so the volume carries over
    image: pgvector/pgvector:pg16
    container_name: welinc_vrms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: welinc_vrms_user
      POSTGRES_PASSWORD: welinc_vrms_pass
      POSTGRES_DB: welinc_vrms_db
    ports:
      - "5433:5432"
    volumes:
      - vrms_pgdata:/var/lib/postgresql/data
    networks:
      - welinc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welinc_vrms_user -d welinc_vrms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spec 0017: local Azure Blob Storage for ticket attachments (blob service only)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: welinc_vrms_azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - vrms_azurite:/data
    networks:
      - welinc-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  vrms-backend:
    build:
      context: ./welinc-backend-vrms
      dockerfile: Dockerfile.dev
    container_name: welinc_vrms_backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./welinc-backend-vrms:/app
      - /app/node_modules
    # Optional: lets the container pick up extra variables from welinc-backend-vrms/.env. The environment block below wins on any overlap.
    env_file:
      - path: ./welinc-backend-vrms/.env
        required: false
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://welinc_vrms_user:welinc_vrms_pass@vrms-db:5432/welinc_vrms_db?schema=public
      JWT_SECRET: dev_secret_key_change_in_production
      # welinc-auth on the internal network; every request's account check calls it (spec 0009)
      AUTH_SERVICE_URL: http://auth-service:3001
      CORS_ORIGINS: http://localhost:8000,http://localhost:8001
      NODE_ENV: development
      # Spec 0017: Azurite's public development account key (not a secret). The backend talks to
      # azurite:10000; links handed to the browser use localhost:10000.
      STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      STORAGE_CONTAINER: vrms-attachments
      STORAGE_PUBLIC_URL: http://localhost:10000/devstoreaccount1
    depends_on:
      vrms-db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - welinc-network

  web-vrms:
    build:
      context: ./welinc-web-vrms
      dockerfile: Dockerfile.dev
    container_name: welinc_vrms_frontend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./welinc-web-vrms:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    networks:
      - welinc-network

volumes:
  vrms_pgdata:
  vrms_azurite:

networks:
  welinc-network:
    name: welinc-network
    external: true
